[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asofaudit"
version = "0.4.0"
description = "Offline bitemporal feature-selection audit against explicit version histories"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
asofaudit = "asofaudit.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
